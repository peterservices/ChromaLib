[project]
name = "chromalib"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Ticataco" }
]
requires-python = ">= 3.11"
dependencies = [
    "pydantic >=2.12.1, <3.0.0",
    "websockets >=17.0, <18.0"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

[project.urls]
Repository = "https://github.com/peterservices/ChromaLib.git"
Issues = "https://github.com/peterservices/ChromaLib/issues"

[dependency-groups]
dev = [
    "pre-commit >= 4.0.0, <5.0.0",
]

[build-system]
requires = ["uv_build >= 0.13 , <0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."
module-name = "chromalib"

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "E",
    "F",
    "FBT",
    "I",
    "ICN",
    "ISC",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SIM",
    "TID",
    "UP",
    "W"
]
ignore = [
    "E501"
]

[tool.pyrefly]
preset = "default"
project-includes = [
    "**/*.py*",
]
