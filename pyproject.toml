[project]
name = "Chroma-Python"
license = "MIT"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.1,<3.0.0",
    "websockets>=17.0,<18.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0,<5.0.0",
]

[tool.ruff.lint]
extend-select = [
    "B",
    "C4",
    "E",
    "F",
    "FBT",
    "I",
    "ICN",
    "ISC",
    "PTH",
    "PYI",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SIM",
    "TID",
    "UP",
    "W"
]
ignore = [
    "E501"
]

[tool.pyrefly]
preset = "default"
project-includes = [
    "**/*.py*",
]
